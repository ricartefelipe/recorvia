version: "2"

run:
  timeout: 10m
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - wastedassign
  settings:
    gosec:
      excludes:
        # G115 (conversões inteiras) é tratado por verificações explícitas de
        # faixa nos pacotes de dinheiro; o alerta genérico gera ruído.
        - G115
  exclusions:
    generated: strict
    paths:
      - internal/dbgen
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ricartefelipe/recorvia
