name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  NODE_VERSION: 22.23.5
  # Trivy em versão fixa, referenciado também pelo digest do índice da imagem.
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

jobs:
  go-quality:
    name: go-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck com versão fixada
        run: make tools-vuln
      - name: Formatação
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: Matriz de permissões atualizada
        run: go run ./tools/permdoc -check
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: Testes unitários com detector de corridas
        run: make test
      - name: Cobertura de domínio e aplicação
        run: make coverage | tee coverage-summary.txt
      - name: Fuzz (execução curta)
        run: FUZZTIME=5s make fuzz
      - name: govulncheck
        run: make vulncheck
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: |
            coverage.out
            coverage-summary.txt
          retention-days: 14

  sqlc-check:
    name: sqlc-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: sqlc com versão fixada
        run: make tools-sqlc
      - name: Código gerado atualizado
        run: make sqlc-check

  go-integration:
    name: go-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Testes de integração (PostgreSQL, RabbitMQ e Redis reais)
        run: make test-integration

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gitleaks (histórico completo)
        run: |
          make tools-gitleaks
          make secrets-scan

  web-quality:
    name: web-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Dependências (lockfile)
        run: npm ci
      - name: Tipos gerados do contrato OpenAPI atualizados
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - name: Tipos, lint, testes de componente e build
        run: npm run verify

  # Validação das configurações do perfil observability com as ferramentas
  # oficiais, nas imagens de versão fixa construídas pelos Dockerfiles de
  # deploy/observability (ADR-052).
  observability-check:
    name: observability-check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Configurações de observabilidade (otelcol validate, jaeger validate, promtool, amtool check-config, dashboards)
        run: make obs-check

  # Ambiente completo com o perfil observability (make up-obs), como no uso
  # local: alvos de coleta, regras, séries usadas pelos alertas, o caminho de
  # um alerta do Prometheus ao e-mail (Alertmanager e Mailpit), fonte de
  # dados e dashboards do Grafana e rastros da API e do worker no Jaeger.
  observability-stack:
    name: observability-stack
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ambiente com o perfil observability e dados de demonstração
        run: make up-obs
      - name: Coleta, regras, alerta até o e-mail, dashboards e rastros
        run: make obs-stack-check
      - name: Logs do ambiente em caso de falha
        if: failure()
        run: |
          docker compose --profile observability ps -a >compose-logs.txt 2>&1 || true
          docker compose --profile observability logs --no-color --tail 300 otel-collector jaeger prometheus alertmanager mailpit grafana api worker rabbitmq >>compose-logs.txt 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: observability-stack-logs
          path: compose-logs.txt
          retention-days: 14

  # Exercício do backup e da restauração (ADR-055) no ambiente do compose:
  # PostgreSQL com bootstrap, migrations e dados de demonstração, faturamento
  # pelo worker (lançamento no ledger), make backup com o worker gravando na
  # origem, make restore-check num banco novo, rejeição de um arquivo
  # corrompido e recuperação num segundo servidor PostgreSQL vazio, como em
  # docs/operacao/backup-e-restauracao.md.
  backup-restore:
    name: backup-restore
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Segundo servidor: projeto do compose separado, com volume e rede
      # próprios e outra porta no host.
      DR_PROJECT: recorvia-dr
      DR_POSTGRES_PORT: "55432"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configuração local (.env a partir de .env.example)
        run: make env
      - name: PostgreSQL, migrations, worker e dados de demonstração
        run: |
          docker compose up -d --build --wait worker
          docker compose --profile seed run --rm --build seed
      - name: Faturamento pelo worker (ao menos um lançamento no ledger)
        run: |
          for _ in $(seq 1 60); do
            n=$(docker compose exec -T postgres psql -X -q -A -t -U postgres -d recorvia -c 'SELECT count(*) FROM ledger_transactions')
            if [ "$n" -gt 0 ]; then
              echo "lançamentos no ledger: $n"
              exit 0
            fi
            sleep 5
          done
          echo "nenhum lançamento no ledger após 5 minutos" >&2
          exit 1
      - name: make backup (worker em execução, escrita concorrente na origem)
        run: make backup
      - name: make restore-check (banco novo, contagens, ledger e isolamento)
        run: make restore-check
      - name: Arquivo de backup corrompido é rejeitado
        run: |
          dump=$(find backups -maxdepth 1 -name '*.dump' -type f | sort | tail -n 1)
          mkdir -p backups/corrompido
          cp "$dump" "${dump%.dump}.manifest" "${dump%.dump}.sha256" backups/corrompido/
          copy="backups/corrompido/$(basename "$dump")"
          printf '\0' >>"$copy"
          if make restore-check DUMP="$copy"; then
            echo "o arquivo corrompido deveria ter sido rejeitado" >&2
            exit 1
          fi
          echo "arquivo corrompido rejeitado"
      - name: Recuperação num servidor novo (bootstrap, pg_restore, migrate up, restore-check)
        run: |
          dump=$(find backups -maxdepth 1 -name '*.dump' -type f | sort | tail -n 1)
          export POSTGRES_PORT=$DR_POSTGRES_PORT
          docker compose -p "$DR_PROJECT" up -d --wait postgres
          docker compose -p "$DR_PROJECT" run --rm migrate-bootstrap
          dr=$(docker compose -p "$DR_PROJECT" ps -q postgres)
          (cd backups && sha256sum -c "$(basename "${dump%.dump}.sha256")")
          docker exec -i "$dr" pg_restore -U postgres -d recorvia --exit-on-error --single-transaction <"$dump"
          docker compose -p "$DR_PROJECT" run --rm --no-deps migrate
          # O servidor novo, depois da restauração, tem o mesmo manifesto da
          # origem no instante do backup.
          RECORVIA_PG_CONTAINER="$dr" RECORVIA_BACKUP_DIR=backups/dr make backup
          diff -u "${dump%.dump}.manifest" "$(find backups/dr -maxdepth 1 -name '*.manifest' -type f | sort | tail -n 1)"
          echo "manifesto do servidor novo idêntico ao da origem"
          RECORVIA_PG_CONTAINER="$dr" make restore-check DUMP="$dump"
      - name: Logs do ambiente
        if: always()
        run: |
          docker compose logs --no-color --tail 300 postgres migrate-bootstrap migrate worker paysim >compose-logs.txt 2>&1 || true
          docker compose -p "$DR_PROJECT" logs --no-color --tail 300 >>compose-logs.txt 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backup-restore
          # Somente manifestos (contagens e somas de verificação) e logs: os
          # arquivos de dump não são publicados.
          path: |
            backups/*.manifest
            backups/dr/*.manifest
            compose-logs.txt
          if-no-files-found: ignore
          retention-days: 14

  # Construção das imagens e análise de vulnerabilidades. Nenhuma imagem é
  # publicada e não há deploy: as imagens existem apenas no runner.
  image-scan:
    name: image-scan (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: api, context: ., dockerfile: deploy/docker/go.Dockerfile, cmd: api }
          - { image: worker, context: ., dockerfile: deploy/docker/go.Dockerfile, cmd: worker }
          - { image: migrate, context: ., dockerfile: deploy/docker/go.Dockerfile, cmd: migrate }
          - { image: seed, context: ., dockerfile: deploy/docker/go.Dockerfile, cmd: seed }
          - { image: paysim, context: ., dockerfile: deploy/docker/go.Dockerfile, cmd: paysim }
          - { image: web, context: web, dockerfile: web/Dockerfile, cmd: "" }
          - { image: keycloak, context: deploy/keycloak, dockerfile: deploy/keycloak/Dockerfile, cmd: "" }
    env:
      IMAGE: recorvia-${{ matrix.image }}:ci
      BUILD_CONTEXT: ${{ matrix.context }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      BUILD_CMD: ${{ matrix.cmd }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construção da imagem (sem publicação)
        run: |
          args=()
          if [ -n "$BUILD_CMD" ]; then args+=(--build-arg "CMD=$BUILD_CMD"); fi
          docker build -f "$DOCKERFILE" "${args[@]}" -t "$IMAGE" "$BUILD_CONTEXT"
      - name: Trivy (falha em HIGH/CRITICAL com correção disponível; exceções em .trivyignore.yaml)
        run: bash deploy/security/image-scan.sh "$IMAGE"

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Ambiente completo (compose) com dados de demonstração
        run: make up
      - name: Playwright (Chromium)
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Roteiros E2E
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test
      - name: Logs do ambiente em caso de falha
        if: failure()
        run: docker compose logs --no-color --tail 300 api worker web keycloak > compose-logs.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-relatorio
          path: |
            web/playwright-report
            web/test-results
            compose-logs.txt
          retention-days: 14
