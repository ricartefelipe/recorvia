        unit_amount_decimal: { type: string, description: "Preço unitário em centavos, até 10 casas (per_unit, usage e flat_plus_overage)" }
        metric_id: { type: string, format: uuid }
        included_quantity: { type: string, description: Franquia incluída (flat_plus_overage) }
    PriceVersion:
      type: object
      required: [id, version, pricing_model, currency, created_at]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        pricing_model: { $ref: "#/components/schemas/PricingModel" }
        flat_amount: { type: integer, format: int64, nullable: true }
        unit_amount_decimal: { type: string, nullable: true }
        metric_id: { type: string, format: uuid, nullable: true }
        included_quantity: { type: string, nullable: true }
        currency: { type: string }
        created_at: { type: string, format: date-time }
    PlanInput:
      type: object
      required: [product_id, code, name, billing_interval, price]
      properties:
        product_id: { type: string, format: uuid }
        code: { type: string, pattern: '^[a-z0-9][a-z0-9_.-]{1,63}$' }
        name: { type: string, minLength: 2, maxLength: 200 }
