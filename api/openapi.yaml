        trial_days: { type: integer, minimum: 0, maximum: 365 }
        status: { type: string, enum: [active, archived] }
    Plan:
      type: object
      required: [id, product_id, code, name, description, billing_interval, currency, trial_days, status, created_at, version]
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        billing_interval: { type: string, enum: [month, year] }
        currency: { type: string }
        trial_days: { type: integer }
        status: { type: string, enum: [active, archived] }
        current_price: { nullable: true, allOf: [ { $ref: "#/components/schemas/PriceVersion" } ] }
        created_at: { type: string, format: date-time }
        version: { type: integer }
    PlanDetails:
      allOf:
        - { $ref: "#/components/schemas/Plan" }
        - type: object
          required: [prices]
          properties:
            prices: { type: array, items: { $ref: "#/components/schemas/PriceVersion" } }
    CouponInput:
      type: object
      required: [code, name, discount_type, duration]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_-]{3,40}$' }
        name: { type: string }
        discount_type: { type: string, enum: [percent, amount] }
        percent_off_bp: { type: integer, minimum: 1, maximum: 10000, description: Pontos-base (1% = 100) }
        amount_off: { type: integer, format: int64, minimum: 1 }
        duration: { type: string, enum: [once, repeating, forever] }
        duration_cycles: { type: integer, minimum: 1, maximum: 120 }
        max_redemptions: { type: integer, minimum: 1, maximum: 1000000000 }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        applies_to_plan_ids: { type: array, items: { type: string, format: uuid } }
    Coupon:
      allOf:
        - { $ref: "#/components/schemas/CouponInput" }
        - type: object
          required: [id, redemptions_count, status, currency, created_at, version]
          properties:
            id: { type: string, format: uuid }
            redemptions_count: { type: integer }
            status: { type: string, enum: [active, archived] }
            currency: { type: string }
            created_at: { type: string, format: date-time }
            version: { type: integer }

    SubscriptionStatus:
      type: string
      enum: [trialing, active, past_due, suspended, canceled]
    ChangeTiming:
      type: string
      enum: [immediate, next_cycle]
    SubscriptionInput:
      type: object
      required: [customer_id, plan_id]
      properties:
        customer_id: { type: string, format: uuid }
        plan_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        start_date: { type: string, format: date, description: Não pode estar no futuro; retroativo até 366 dias }
        trial_days: { type: integer, minimum: 0, maximum: 365 }
        payment_terms_days: { type: integer, minimum: 0, maximum: 120 }
    Subscription:
      type: object
      required: [id, customer_id, plan_id, price_version_id, status, quantity, billing_interval, timezone, anchor_date,
                 started_at, current_period_start, current_period_end, cancel_at_period_end, created_at, version]
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        customer_name: { type: string }
        plan_id: { type: string, format: uuid }
        plan_name: { type: string }
        price_version_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/SubscriptionStatus" }
        quantity: { type: integer }
        billing_interval: { type: string, enum: [month, year] }
        timezone: { type: string }
        anchor_date: { type: string, format: date }
        trial_ends_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time }
        current_period_start: { type: string, format: date-time }
        current_period_end: { type: string, format: date-time }
        next_billing_at: { type: string, format: date-time, nullable: true }
        cancel_at_period_end: { type: boolean }
        canceled_at: { type: string, format: date-time, nullable: true }
        cancel_reason: { type: string }
        ended_at: { type: string, format: date-time, nullable: true }
        suspended_at: { type: string, format: date-time, nullable: true }
        payment_terms_days: { type: integer, nullable: true }
        scheduled_changes:
          type: array
          items:
            type: object
            required: [id, kind, effective_at, status]
            properties:
              id: { type: string, format: uuid }
              kind: { type: string, enum: [plan_change, quantity_change] }
              new_plan_id: { type: string, format: uuid, nullable: true }
              new_quantity: { type: integer, nullable: true }
              effective_at: { type: string, format: date-time }
              status: { type: string, enum: [pending, applied, canceled] }
        discount: { nullable: true, allOf: [ { $ref: "#/components/schemas/SubscriptionDiscount" } ] }
        created_at: { type: string, format: date-time }
        version: { type: integer }
    SubscriptionPage:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Subscription" } }
        next_cursor: { type: string, nullable: true }
    SubscriptionHistoryEntry:
      type: object
      required: [id, event, to_status, occurred_at, actor_type]
      properties:
        id: { type: string, format: uuid }
        event: { type: string }
        from_status: { type: string, nullable: true }
        to_status: { type: string }
        occurred_at: { type: string, format: date-time }
        actor_type: { type: string }
        actor_id: { type: string }
        details: { type: object, additionalProperties: true }
    SubscriptionDiscount:
      type: object
      required: [id, coupon_id, coupon_code, status, created_at]
      properties:
        id: { type: string, format: uuid }
        coupon_id: { type: string, format: uuid }
        coupon_code: { type: string }
        remaining_cycles: { type: integer, nullable: true }
        status: { type: string, enum: [active, ended] }
        created_at: { type: string, format: date-time }
    PriceAdjustmentInput:
      type: object
      required: [effective_date, kind, reason]
      properties:
        effective_date: { type: string, format: date, description: Vale a partir do primeiro ciclo iniciado nesta data ou depois }
        kind: { type: string, enum: [percent, fixed_amount] }
        percent_bp: { type: integer, minimum: -10000, maximum: 100000, description: "Pontos-base (IPCA de 4,5% = 450)" }
        new_amount: { type: integer, format: int64, minimum: 0, description: Novo valor fixo ou unitário em centavos }
        index_name: { type: string, maxLength: 50, description: Rótulo do índice de referência (informativo) }
        reason: { type: string, minLength: 3, maxLength: 500 }
    PriceAdjustment:
      allOf:
        - { $ref: "#/components/schemas/PriceAdjustmentInput" }
        - type: object
          required: [id, status, created_at]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [scheduled, applied, canceled] }
            applied_at: { type: string, format: date-time, nullable: true }
            previous_amount:
              type: integer
              format: int64
              nullable: true
              description: Componente fixo antes do reajuste, em centavos, arredondado (half-even) para exibição
            resulting_amount:
              type: integer
              format: int64
              nullable: true
              description: Componente fixo após o reajuste, em centavos, arredondado (half-even) para exibição
            previous_amount_decimal:
              type: string
              nullable: true
              pattern: '^[0-9]+(\.[0-9]{1,10})?$'
              description: Valor exato antes do reajuste, em centavos (no preço por unidade pode ter até 10 casas decimais)
            resulting_amount_decimal:
              type: string
              nullable: true
              pattern: '^[0-9]+(\.[0-9]{1,10})?$'
              description: >-
                Valor exato após o reajuste, em centavos. No preço por unidade, o percentual incide sobre o preço
                unitário exato, arredondado a 10 casas; o total do item é arredondado a centavos uma única vez.
            canceled_at: { type: string, format: date-time, nullable: true }
            cancel_reason:
              type: string
              nullable: true
              enum: [manual, subscription_ended, price_version_changed, price_without_fixed_component, adjustment_amount_limit, null]
              description: >-
                Motivo do cancelamento: manual; assinatura encerrada; troca da versão de preço; preço somente por consumo
                no início do ciclo; valor resultante acima do limite
            created_at: { type: string, format: date-time }
    SubscriptionUsage:
      type: object
      required: [period_start, period_end, metrics]
      properties:
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        metrics:
          type: array
          items:
            type: object
            required: [metric_id, code, name, unit, aggregation, quantity, event_count]
            properties:
              metric_id: { type: string, format: uuid }
              code: { type: string }
              name: { type: string }
              unit: { type: string }
              aggregation: { $ref: "#/components/schemas/Aggregation" }
              quantity: { type: string }
              event_count: { type: integer }
              estimated_amount: { type: integer, format: int64 }

    UsageEventInput:
      type: object
      required: [external_id, subscription_id, metric_code, quantity, occurred_at]
      properties:
        external_id: { type: string, minLength: 1, maxLength: 128 }
        subscription_id: { type: string, format: uuid }
        metric_code: { type: string }
        unit: { type: string, description: "Se informado, deve coincidir com a unidade da métrica" }
        quantity: { type: string, description: Decimal não negativo }
        unique_key: { type: string, maxLength: 128, description: Chave para métricas unique_count }
        occurred_at: { type: string, format: date-time, description: "Precisão de microssegundos; frações menores são descartadas" }
        properties: { type: object, additionalProperties: true, description: "Até 4 KB serializado, sem o caractere NUL (\\u0000)" }
    UsageBatchResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [external_id, outcome]
            properties:
              external_id: { type: string }
              outcome: { type: string, enum: [accepted, duplicate, late, rejected] }
              event_id: { type: string, format: uuid, nullable: true }
              error: { type: string }
    UsageEvent:
      type: object
      required: [id, external_id, subscription_id, metric_id, quantity, occurred_at, received_at, status]
      properties:
        id: { type: string, format: uuid }
        external_id: { type: string }
        subscription_id: { type: string, format: uuid }
        metric_id: { type: string, format: uuid }
        quantity: { type: string }
        unique_key: { type: string, nullable: true }
        occurred_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
