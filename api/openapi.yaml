      responses:
        "200": { description: Operações externas, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/PaymentOperation" } } } } } } }
  /api/v1/payment-operations/{id}/retry:
    post:
      tags: [payments]
      operationId: retryPaymentOperation
      summary: Reconsulta o provedor para resolver operação com resultado desconhecido
      description: >-
        Reexecuta agora uma operação pendente, com resultado desconhecido ou com lease vencido, sem esperar
        next_attempt_at: consulta o provedor pela referência externa e só cria a cobrança se ela não existir.
        O limite de tentativas automáticas vale para operações com resultado desconhecido ou em execução;
        uma operação pendente que esgotou as tentativas pode ser reexecutada. Se a cobrança não está mais
        pendente (por exemplo, cancelada com a fatura), nunca cria: vincula a cobrança encontrada no provedor
        ou encerra a operação como failed.
      parameters: [ { $ref: "#/components/parameters/Tenant" }, { $ref: "#/components/parameters/CSRF" }, { $ref: "#/components/parameters/ID" } ]
      responses:
        "200": { description: Operação executada; a situação devolvida é o resultado da tentativa, content: { application/json: { schema: { $ref: "#/components/schemas/PaymentOperation" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: "Nada executado: operação concluída (operation_completed), esgotada (operation_attempts_exhausted) ou em execução (operation_in_progress)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

