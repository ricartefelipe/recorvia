openapi: 3.0.3
info:
  title: Recorvia API
  version: 0.1.0
  description: |
    API do Recorvia: gestão de assinaturas, faturamento recorrente, cobranças,
    inadimplência e conciliação de recebíveis.

    Convenções:
    - Valores monetários em unidades mínimas inteiras (centavos) com `currency`.
      Preços unitários fracionários usam `unit_amount_decimal` (texto decimal em
      centavos, até 10 casas).
    - Instantes em RFC 3339 (UTC). Datas civis no formato `AAAA-MM-DD`, no fuso
      da organização.
    - Listas paginadas por cursor: `limit` (1 a 100, padrão 25) e `cursor`.
      A ordenação é determinística (desempate por `id`).
    - Erros no formato RFC 9457 (`application/problem+json`).
    - Concorrência otimista: recursos expõem `version` e `ETag`; alterações
      exigem `If-Match: "<version>"` quando indicado.
    - Operações financeiras de criação exigem `Idempotency-Key`.
    - Navegador: sessão por cookie HttpOnly, header `X-CSRF-Token` em métodos
      que alteram estado e `X-Recorvia-Tenant` igual à organização ativa.
    - Integrações: `Authorization: Bearer rcv_...` (credencial com escopos e
      vinculada a uma organização).
servers:
  - url: /
tags:
  - name: health
  - name: auth
  - name: organizations
  - name: platform
  - name: customers
  - name: catalog
  - name: subscriptions
  - name: usage
  - name: invoices
  - name: payments
  - name: integrations
  - name: ledger
  - name: reconciliation
  - name: collections
  - name: webhooks
  - name: operations
  - name: audit
  - name: dashboard
  - name: portal
security:
  - session: []
  - apiCredential: []

paths:
  /livez:
    get:
      tags: [health]
      operationId: livez
      security: []
      summary: Processo em execução (não verifica dependências)
      responses:
        "200": { $ref: "#/components/responses/Health" }
  /readyz:
    get:
      tags: [health]
      operationId: readyz
      security: []
      summary: Pronto para receber tráfego (verifica dependências críticas)
      responses:
        "200": { $ref: "#/components/responses/Health" }
        "503": { $ref: "#/components/responses/Health" }

  /auth/login:
    get:
      tags: [auth]
      operationId: authLogin
      security: []
      summary: Inicia login no provedor de identidade (Authorization Code + PKCE)
      parameters:
        - { name: return_to, in: query, schema: { type: string, maxLength: 512 } }
      responses:
        "302": { description: Redirecionamento para o provedor de identidade }
  /auth/callback:
    get:
      tags: [auth]
      operationId: authCallback
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "302": { description: Sessão criada; redireciona para a aplicação }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      parameters: [ { $ref: "#/components/parameters/CSRF" } ]
      responses:
        "200":
          description: Sessão encerrada
          content:
            application/json:
              schema:
                type: object
                required: [redirect_url]
                properties:
                  redirect_url: { type: string }

  /api/v1/session:
    get:
      tags: [auth]
      operationId: getSession
      security: [ { session: [] } ]
      responses:
        "200": { description: Sessão atual, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/session/tenant:
    put:
      tags: [auth]
      operationId: switchTenant
      security: [ { session: [] } ]
      parameters: [ { $ref: "#/components/parameters/CSRF" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id: { type: string, format: uuid }
      responses:
        "200": { description: Organização ativa alterada (sessão rotacionada), content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/organizations:
    post:
      tags: [organizations]
      operationId: createOrganization
      summary: Onboarding de nova organização
      security: [ { session: [] } ]
      parameters: [ { $ref: "#/components/parameters/CSRF" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationInput" } } }
      responses:
        "201": { description: Organização criada; sessão rotacionada com a nova organização ativa, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/invitations/accept:
    post:
      tags: [organizations]
      operationId: acceptInvitation
      security: [ { session: [] } ]
      parameters: [ { $ref: "#/components/parameters/CSRF" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 20, maxLength: 200 }
      responses:
        "200":
          description: Convite aceito
          content:
            application/json:
              schema:
                type: object
                required: [tenant_id, role]
                properties:
                  tenant_id: { type: string, format: uuid }
                  role: { $ref: "#/components/schemas/Role" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /api/v1/organization:
    get:
      tags: [organizations]
      operationId: getOrganization
      parameters: [ { $ref: "#/components/parameters/Tenant" } ]
      responses:
        "200": { description: Organização, content: { application/json: { schema: { $ref: "#/components/schemas/Organization" } } } }
    patch:
      tags: [organizations]
      operationId: updateOrganization
      parameters: [ { $ref: "#/components/parameters/Tenant" }, { $ref: "#/components/parameters/CSRF" }, { $ref: "#/components/parameters/IfMatch" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationUpdate" } } }
      responses:
        "200": { description: Atualizada, content: { application/json: { schema: { $ref: "#/components/schemas/Organization" } } } }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/roles:
    get:
      tags: [organizations]
      operationId: listRoles
      parameters: [ { $ref: "#/components/parameters/Tenant" } ]
      responses:
        "200":
          description: Matriz de permissões por papel
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RolePermissions" }
  /api/v1/members:
    get:
      tags: [organizations]
      operationId: listMembers
      parameters: [ { $ref: "#/components/parameters/Tenant" } ]
      responses:
        "200": { description: Membros, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Member" } } } } } } }
  /api/v1/members/{user_id}:
    parameters: [ { $ref: "#/components/parameters/Tenant" }, { name: user_id, in: path, required: true, schema: { type: string, format: uuid } } ]
    patch:
      tags: [organizations]
      operationId: updateMemberRole
      parameters: [ { $ref: "#/components/parameters/CSRF" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [role], properties: { role: { $ref: "#/components/schemas/Role" } } } } }
      responses:
        "200": { description: Papel alterado, content: { application/json: { schema: { $ref: "#/components/schemas/Member" } } } }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [organizations]
      operationId: removeMember
      parameters: [ { $ref: "#/components/parameters/CSRF" } ]
      responses:
        "204": { description: Removido }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/invitations:
    get:
      tags: [organizations]
      operationId: listInvitations
      parameters: [ { $ref: "#/components/parameters/Tenant" } ]
      responses:
        "200": { description: Convites, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Invitation" } } } } } } }
    post:
      tags: [organizations]
      operationId: createInvitation
      parameters: [ { $ref: "#/components/parameters/Tenant" }, { $ref: "#/components/parameters/CSRF" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201": { description: Convite criado; accept_url é exibida uma única vez, content: { application/json: { schema: { $ref: "#/components/schemas/InvitationCreated" } } } }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/invitations/{id}:
    delete:
      tags: [organizations]
      operationId: revokeInvitation
      parameters: [ { $ref: "#/components/parameters/Tenant" }, { $ref: "#/components/parameters/CSRF" }, { $ref: "#/components/parameters/ID" } ]
      responses:
        "204": { description: Revogado }
        "409": { $ref: "#/components/responses/Problem" }

  /api/v1/platform/overview:
    get:
      tags: [platform]
      operationId: getPlatformOverview
      parameters: [ { $ref: "#/components/parameters/Tenant" } ]
      responses:
        "200": { description: Plano da plataforma e consumo de limites, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformOverview" } } } }
  /api/v1/platform/plans:
    get:
      tags: [platform]
      operationId: listPlatformPlans
      parameters: [ { $ref: "#/components/parameters/Tenant" } ]
      responses:
        "200": { description: Planos da plataforma, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/PlatformPlan" } } } } } } }
  /api/v1/platform/plan:
    put:
      tags: [platform]
      operationId: changePlatformPlan
      parameters: [ { $ref: "#/components/parameters/Tenant" }, { $ref: "#/components/parameters/CSRF" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [plan_code], properties: { plan_code: { type: string } } } } }
      responses:
        "200": { description: Plano alterado, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformOverview" } } } }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/platform/addons:
    get:
      tags: [platform]
      operationId: listPlatformAddons
      parameters: [ { $ref: "#/components/parameters/Tenant" } ]
      responses:
        "200": { description: Serviços adicionais, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/PlatformAddon" } } } } } } }
  /api/v1/platform/addon-orders:
    get:
      tags: [platform]
      operationId: listAddonOrders
      parameters: [ { $ref: "#/components/parameters/Tenant" } ]
      responses:
        "200": { description: Pedidos, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/AddonOrder" } } } } } } }
    post:
      tags: [platform]
      operationId: createAddonOrder
      parameters: [ { $ref: "#/components/parameters/Tenant" }, { $ref: "#/components/parameters/CSRF" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [addon_code], properties: { addon_code: { type: string }, notes: { type: string, maxLength: 2000 } } } } }
      responses:
        "201": { description: Pedido registrado, content: { application/json: { schema: { $ref: "#/components/schemas/AddonOrder" } } } }
  /api/v1/platform/statements:
    get:
      tags: [platform]
      operationId: listPlatformStatements
      parameters: [ { $ref: "#/components/parameters/Tenant" } ]
      responses:
        "200": { description: Demonstrativos mensais da plataforma, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/PlatformStatement" } } } } } } }
  /api/v1/admin/tenants:
    get:
      tags: [platform]
      operationId: adminListTenants
      summary: Catálogo de organizações para a equipe da plataforma (sem dados financeiros dos clientes)
      security: [ { session: [] } ]
      responses:
        "200": { description: Organizações, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/AdminTenant" } } } } } } }
        "403": { $ref: "#/components/responses/Problem" }

  /api/v1/customers:
    get:
      tags: [customers]
      operationId: listCustomers
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: status, in: query, schema: { type: string, enum: [active, archived] } }
        - { name: q, in: query, description: "Busca por nome, documento ou identificador externo", schema: { type: string, maxLength: 100 } }
        - { name: sort, in: query, schema: { type: string, enum: [name, -name, created_at, -created_at] } }
      responses:
        "200": { description: Clientes, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerPage" } } } }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      tags: [customers]
      operationId: createCustomer
      parameters: [ { $ref: "#/components/parameters/Tenant" }, { $ref: "#/components/parameters/CSRF" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CustomerInput" } } }
      responses:
        "201": { description: Cliente criado, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerDetails" } } } }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/customers/{id}:
    parameters: [ { $ref: "#/components/parameters/Tenant" }, { $ref: "#/components/parameters/ID" } ]
    get:
      tags: [customers]
      operationId: getCustomer
      responses:
        "200": { description: Cliente, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerDetails" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [customers]
      operationId: updateCustomer
      parameters: [ { $ref: "#/components/parameters/CSRF" }, { $ref: "#/components/parameters/IfMatch" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CustomerInput" } } }
      responses:
        "200": { description: Atualizado, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerDetails" } } } }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/customers/{id}/archive:
    post:
      tags: [customers]
      operationId: archiveCustomer
      parameters: [ { $ref: "#/components/parameters/Tenant" }, { $ref: "#/components/parameters/CSRF" }, { $ref: "#/components/parameters/ID" } ]
      responses:
        "200": { description: Arquivado, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerDetails" } } } }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/customers/{id}/contacts:
    post:
      tags: [customers]
      operationId: addCustomerContact
      parameters: [ { $ref: "#/components/parameters/Tenant" }, { $ref: "#/components/parameters/CSRF" }, { $ref: "#/components/parameters/ID" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ContactInput" } } }
      responses:
        "201": { description: Contato adicionado, content: { application/json: { schema: { $ref: "#/components/schemas/Contact" } } } }
  /api/v1/customers/{id}/contacts/{contact_id}:
    delete:
      tags: [customers]
      operationId: removeCustomerContact
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { $ref: "#/components/parameters/CSRF" }
        - { $ref: "#/components/parameters/ID" }
        - { name: contact_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removido }
  /api/v1/customers/{id}/billing-address:
    put:
      tags: [customers]
      operationId: setCustomerAddress
      parameters: [ { $ref: "#/components/parameters/Tenant" }, { $ref: "#/components/parameters/CSRF" }, { $ref: "#/components/parameters/ID" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Address" } } }
      responses:
        "200": { description: Endereço gravado, content: { application/json: { schema: { $ref: "#/components/schemas/Address" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/customers/{id}/history:
    get:
      tags: [customers]
      operationId: getCustomerHistory
      parameters: [ { $ref: "#/components/parameters/Tenant" }, { $ref: "#/components/parameters/ID" } ]
      responses:
        "200": { description: Histórico do cliente (auditoria), content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } } } } } } }
  /api/v1/customers/{id}/credits:
    get:
      tags: [customers]
      operationId: getCustomerCredits
      parameters: [ { $ref: "#/components/parameters/Tenant" }, { $ref: "#/components/parameters/ID" } ]
      responses:
        "200": { description: Saldo e movimentos de crédito, content: { application/json: { schema: { $ref: "#/components/schemas/CreditBalance" } } } }
    post:
      tags: [customers]
      operationId: grantCustomerCredit
      parameters: [ { $ref: "#/components/parameters/Tenant" }, { $ref: "#/components/parameters/CSRF" }, { $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/ID" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, reason]
              properties:
                amount: { type: integer, format: int64, minimum: 1 }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "201": { description: Crédito concedido, content: { application/json: { schema: { $ref: "#/components/schemas/CreditBalance" } } } }
  /api/v1/customers/{id}/portal-links:
    post:
      tags: [customers]
      operationId: createPortalLink
      parameters: [ { $ref: "#/components/parameters/Tenant" }, { $ref: "#/components/parameters/CSRF" }, { $ref: "#/components/parameters/ID" } ]
      responses:
        "201":
          description: Link temporário de uso único para o portal do cliente
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at]
                properties:
                  url: { type: string }
                  expires_at: { type: string, format: date-time }

  /api/v1/products:
    get:
      tags: [catalog]
      operationId: listProducts
      parameters: [ { $ref: "#/components/parameters/Tenant" }, { name: status, in: query, schema: { type: string, enum: [active, archived] } } ]
      responses:
        "200": { description: Produtos, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Product" } } } } } } }
    post:
      tags: [catalog]
      operationId: createProduct
      parameters: [ { $ref: "#/components/parameters/Tenant" }, { $ref: "#/components/parameters/CSRF" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProductInput" } } }
      responses:
        "201": { description: Produto criado, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/products/{id}:
    patch:
      tags: [catalog]
      operationId: updateProduct
      parameters: [ { $ref: "#/components/parameters/Tenant" }, { $ref: "#/components/parameters/CSRF" }, { $ref: "#/components/parameters/IfMatch" }, { $ref: "#/components/parameters/ID" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/ProductInput" }
                - type: object
                  required: [status]
                  properties:
                    status: { type: string, enum: [active, archived] }
      responses:
        "200": { description: Atualizado, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }
        "412": { $ref: "#/components/responses/Problem" }
  /api/v1/metrics:
    get:
      tags: [catalog]
      operationId: listMetrics
      parameters: [ { $ref: "#/components/parameters/Tenant" } ]
      responses:
        "200": { description: Métricas, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Metric" } } } } } } }
    post:
      tags: [catalog]
      operationId: createMetric
      parameters: [ { $ref: "#/components/parameters/Tenant" }, { $ref: "#/components/parameters/CSRF" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MetricInput" } } }
      responses:
        "201": { description: Métrica criada, content: { application/json: { schema: { $ref: "#/components/schemas/Metric" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/plans:
    get:
      tags: [catalog]
      operationId: listPlans
      parameters:
        - { $ref: "#/components/parameters/Tenant" }
        - { name: status, in: query, schema: { type: string, enum: [active, archived] } }
        - { name: product_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Planos, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Plan" } } } } } } }
    post:
      tags: [catalog]
      operationId: createPlan
      parameters: [ { $ref: "#/components/parameters/Tenant" }, { $ref: "#/components/parameters/CSRF" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PlanInput" } } }
      responses:
        "201": { description: Plano criado, content: { application/json: { schema: { $ref: "#/components/schemas/PlanDetails" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/plans/{id}:
    parameters: [ { $ref: "#/components/parameters/Tenant" }, { $ref: "#/components/parameters/ID" } ]
    get:
      tags: [catalog]
      operationId: getPlan
      responses:
        "200": { description: Plano com versões de preço, content: { application/json: { schema: { $ref: "#/components/schemas/PlanDetails" } } } }
    patch:
      tags: [catalog]
      operationId: updatePlan
      parameters: [ { $ref: "#/components/parameters/CSRF" }, { $ref: "#/components/parameters/IfMatch" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PlanUpdate" } } }
      responses:
        "200": { description: Atualizado, content: { application/json: { schema: { $ref: "#/components/schemas/PlanDetails" } } } }
