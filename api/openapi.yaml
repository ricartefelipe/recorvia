        late_grace_hours: { type: integer, minimum: 0, maximum: 720 }
    Metric:
      type: object
      required: [id, code, name, unit, aggregation, max_quantity_per_event, late_grace_hours, status, created_at]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        unit: { type: string }
        aggregation: { $ref: "#/components/schemas/Aggregation" }
        max_quantity_per_event: { type: string }
        late_grace_hours: { type: integer }
        status: { type: string, enum: [active, archived] }
