        billing_interval: { type: string, enum: [month, year] }
        trial_days: { type: integer, minimum: 0, maximum: 365 }
        price: { $ref: "#/components/schemas/PriceInput" }
    PlanUpdate:
      type: object
      required: [name, trial_days, status]
      properties:
        name: { type: string, minLength: 2, maxLength: 200 }
