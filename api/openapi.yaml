components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: recorvia_session
      description: Sessão do navegador (nome do cookie varia por ambiente; em produção usa o prefixo __Host-)
    portalSession:
      type: apiKey
      in: cookie
      name: recorvia_portal
    apiCredential:
      type: http
      scheme: bearer
      description: Credencial de integração (rcv_...) vinculada a uma organização, com escopos

  parameters:
    Tenant:
      name: X-Recorvia-Tenant
      in: header
      description: Organização ativa. Validada contra a sessão ou a credencial; divergência gera 409.
      schema: { type: string, format: uuid }
    CSRF:
      name: X-CSRF-Token
      in: header
      description: Obrigatório para sessões de navegador em métodos que alteram estado.
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Versão esperada do recurso, entre aspas (ex. "3").
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave única (8 a 255 caracteres) por operação; repetição equivalente devolve o resultado registrado.
      schema: { type: string, minLength: 8, maxLength: 255 }
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 512 }

  responses:
    Problem:
      description: Erro estruturado (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Health:
      description: Situação de saúde
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [ok, degraded, unavailable] }
              checks:
                type: object
                additionalProperties: { type: string }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        request_id: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    Role:
      type: string
      enum: [owner, admin, finance, operator, auditor]
    RolePermissions:
      type: object
      required: [role, permissions]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        permissions: { type: array, items: { type: string } }

    User:
      type: object
      required: [id, email, display_name]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
    OrganizationSummary:
      type: object
      required: [id, name, slug, role, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        status: { type: string }
    Session:
      type: object
      required: [user, csrf_token, organizations, platform_staff]
      properties:
        user: { $ref: "#/components/schemas/User" }
        csrf_token: { type: string }
        platform_staff: { type: boolean }
        organizations: { type: array, items: { $ref: "#/components/schemas/OrganizationSummary" } }
        active_tenant:
          nullable: true
          allOf:
            - { $ref: "#/components/schemas/OrganizationSummary" }
