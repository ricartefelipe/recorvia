# Ambiente local do Recorvia. Uso: make up (ou docker compose up -d --wait).
name: recorvia

x-go-build: &go-build
  context: .
  dockerfile: deploy/docker/go.Dockerfile

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?defina no .env}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Executa o bootstrap de papéis e as migrations e termina.
  migrate:
    build:
      <<: *go-build
      args:
        CMD: migrate
    image: recorvia-migrate:local
    entrypoint: ["/app"]
    command: ["up"]
    depends_on:
      migrate-bootstrap:
        condition: service_completed_successfully
    environment:
      RECORVIA_MIGRATIONS_DATABASE_URL: postgres://recorvia_owner:${RECORVIA_OWNER_PASSWORD}@postgres:5432/recorvia?sslmode=disable
    restart: "no"

  migrate-bootstrap:
    image: recorvia-migrate:local
    build:
      <<: *go-build
      args:
        CMD: migrate
    command: ["bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RECORVIA_BOOTSTRAP_DATABASE_URL: postgres://postgres:${POSTGRES_SUPERUSER_PASSWORD}@postgres:5432/postgres?sslmode=disable
      RECORVIA_OWNER_PASSWORD: ${RECORVIA_OWNER_PASSWORD:?defina no .env}
      RECORVIA_APP_PASSWORD: ${RECORVIA_APP_PASSWORD:?defina no .env}
    restart: "no"

volumes:
  postgres-data:
