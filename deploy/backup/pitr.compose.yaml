# Ambiente do exercício de recuperação para um ponto no tempo (make
# pitr-check, deploy/backup/pitr-check.sh, ADR-087). Usado sempre junto com o
# compose da aplicação, o ambiente isolado do exercício de recuperação de
# desastre e o componente de backup contínuo, com um nome de projeto próprio:
#   docker compose -p recorvia-pitrcheck -f compose.yaml -f deploy/backup/dr.compose.yaml \
#     -f deploy/postgres/compose.yaml -f deploy/backup/pitr.compose.yaml ...
#
# Acrescenta:
# - MinIO como armazenamento compatível com S3 (faz o papel do serviço
#   externo: sobrevive ao desastre). O bucket é criado na partida, como
#   diretório do volume de dados;
# - o PostgreSQL com arquivamento de WAL e o agente de backup (imagem
#   recorvia-postgres com a etiqueta do exercício);
# - o Keycloak com o banco dele no mesmo servidor PostgreSQL (banco keycloak,
#   criado pelo roteiro), para que o backup base e o WAL cubram também o
#   provedor de identidade.
# Containers e volumes levam o rótulo recorvia.dr-check, como no
# dr.compose.yaml: o roteiro só remove o que é dele (deploy/backup/dr-lib.sh).
x-dr-labels: &dr-labels
  recorvia.dr-check: "1"

services:
  minio:
    labels: *dr-labels
    # Fork mantido do MinIO (a distribuição oficial de imagens foi
    # encerrada), versão fixa e digest do índice.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    entrypoint: ["bash", "-c", "mkdir -p /data/recorvia-backup && exec minio server /data --address :9000 --console-address :9001"]
    environment:
      MINIO_ROOT_USER: ${RECORVIA_PITR_S3_ACCESS_KEY_ID:?defina a credencial do MinIO}
      MINIO_ROOT_PASSWORD: ${RECORVIA_PITR_S3_SECRET_ACCESS_KEY:?defina a credencial do MinIO}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    labels: *dr-labels
    image: recorvia-postgres:${RECORVIA_DR_IMAGE_TAG:-pitr}
    depends_on:
      minio: { condition: service_healthy }

  postgres-backup:
    labels: *dr-labels
    image: recorvia-postgres:${RECORVIA_DR_IMAGE_TAG:-pitr}
    restart: "no"
    # Porta das métricas do agente, lida pelo roteiro (RPO observado).
    ports:
      - "127.0.0.1::9187"

  keycloak:
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${RECORVIA_PITR_KEYCLOAK_DB_PASSWORD:?defina a senha do banco do Keycloak}
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  minio-data:
    labels: *dr-labels
