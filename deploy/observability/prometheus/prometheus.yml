# Prometheus do ambiente local (perfil observability). Os alvos são os nomes
# de serviço do compose; nenhuma porta de métricas é publicada no host.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

# Encaminhamento dos alertas (ADR-065): roteamento por severidade,
# agrupamento, inibição e receptores ficam no Alertmanager.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: recorvia-api
    static_configs:
      - targets: ["api:9091"]
  - job_name: recorvia-worker
    static_configs:
      - targets: ["worker:9091"]
  # Métricas agregadas do nó RabbitMQ (plugin rabbitmq_prometheus).
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
  # Métricas por fila (profundidade, consumidores e idade da mensagem na
  # cabeça). As filas são uma por consumidor, sem dados de tenant.
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count, queue_metrics]
    static_configs:
      - targets: ["rabbitmq:15692"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  # Notificações enviadas e com falha por integração (alertas do caminho de
  # alertas).
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
