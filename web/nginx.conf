# Interface web do Recorvia: SPA estática e proxy para a API Go.
# Arquivo incluído no bloco http da imagem nginx-unprivileged
# (/etc/nginx/conf.d/default.conf).

# DNS embutido do Docker: "api" é resolvido a cada requisição, então o nginx
# sobe mesmo que a API ainda não esteja no ar (ajuste fora do Docker Compose).
resolver 127.0.0.11 valid=10s ipv6=off;

# Preserva o esquema original quando há outro proxy TLS à frente.
map $http_x_forwarded_proto $recorvia_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Cache longo para assets com hash; index.html e rotas da SPA sempre
# revalidados; respostas da API mantêm os cabeçalhos do backend.
map $uri $recorvia_cache_control {
    default                  "no-cache";
    ~^/assets/               "public, max-age=31536000, immutable";
    ~^/(api|auth|webhooks)/  "";
    ~^/portal/access         "";
}

# Formato de log sem a query string (usado em rotas que recebem tokens na URL).
log_format recorvia_sem_query '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                              '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    # Limite de corpo das requisições (a API recusa acima disso).
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Cabeçalhos de segurança em todas as respostas (nenhum location redefine
    # add_header, então nada se perde por herança).
    # - script-src 'self': nenhum script inline ou eval.
    # - style-src 'unsafe-inline': o Mantine injeta variáveis CSS em <style> e usa
    #   atributos style em tempo de execução; o documento HTML da fatura, exibido
    #   em iframe sandbox sem scripts, também usa estilos inline. Scripts seguem
    #   restritos a 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control $recorvia_cache_control always;

    # Proxy para a API: preserva Host e X-Forwarded-*, sem buffering
    # desnecessário (respostas e corpos seguem em fluxo).
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $recorvia_forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_redirect off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    set $recorvia_api http://api:8081;

    location /api/ {
        proxy_pass $recorvia_api;
    }

    location /auth/ {
        proxy_pass $recorvia_api;
    }

    # O link do portal leva um token de uso único na query string: o acesso é
    # registrado sem a query string para o token não ficar no log.
    location = /portal/access {
        access_log /var/log/nginx/access.log recorvia_sem_query;
        proxy_pass $recorvia_api;
    }

    location /webhooks/ {
        proxy_pass $recorvia_api;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets com hash: nunca caem no fallback da SPA.
    location /assets/ {
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    # SPA: rotas do cliente (inclusive /portal) servem o index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
